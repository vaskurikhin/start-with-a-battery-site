<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#f7f7ec"/><rect x="48" y="48" width="698" height="1027" rx="32" fill="none" stroke="#356c44" stroke-width="3"/><g font-family="Arial,sans-serif" fill="#243e2e"><text x="85" y="150" font-size="23">ЭКОМИССИЯ — НАШ ДОМ</text><text x="85" y="245" font-size="62" font-weight="bold">Начни с</text><text x="85" y="318" font-size="62" font-weight="bold">батарейки</text><text x="85" y="390" font-size="28">Сортируй, как сосед 🌿</text><text x="85" y="490" font-size="24">1. Батарейки — в подходящий пункт.</text><text x="85" y="550" font-size="24">Храни сухими, вне доступа детей.</text><text x="85" y="610" font-size="24">Контакты литиевых и кнопочных</text><text x="85" y="645" font-size="24">элементов изолируй лентой.</text><text x="85" y="725" font-size="24">2. Картон — чистый, сухой, сложенный.</text><text x="85" y="805" font-size="24">3. Упаковка — по списку пункта.</text><text x="85" y="885" font-size="24">Перед поездкой проверь часы и правила.</text><text x="85" y="980" font-size="21">Адрес проверенного пункта: ____________</text><text x="85" y="1020" font-size="17">Повреждённым аккумуляторам нужна отдельная инструкция.</text></g></svg>